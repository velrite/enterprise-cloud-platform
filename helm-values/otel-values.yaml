mode: daemonset
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  exporters:
    otlphttp/tempo:
      endpoint: http://tempo:3100
      tls:
        insecure: true
    loki:
      endpoint: http://loki:3100/loki/api/v1/push
  service:
    pipelines:
      traces:
        receivers: [otlp]
        exporters: [otlphttp/tempo]
      logs:
        receivers: [otlp]
        exporters: [loki]
