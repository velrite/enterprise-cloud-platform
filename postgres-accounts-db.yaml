apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: bank-of-anthos
stringData:
  POSTGRES_USER: accounts-admin
  POSTGRES_PASSWORD: accounts-pwd
  POSTGRES_DB: accounts-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: accounts-db
  namespace: bank-of-anthos
spec:
  serviceName: accounts-db
  replicas: 1
  selector:
    matchLabels:
      app: accounts-db
  template:
    metadata:
      labels:
        app: accounts-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "accounts-admin"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-db
  namespace: bank-of-anthos
spec:
  selector:
    app: accounts-db
  ports:
    - port: 5432
      targetPort: 5432
