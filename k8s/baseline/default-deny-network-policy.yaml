apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: bank-of-anthos
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # allow traffic from other pods in this same namespace (needed for etcd/Patroni/Redis Sentinel peer traffic, and userservice serving requests)
    - from:
        - podSelector: {}
  egress:
    # DNS — every pod needs this to resolve any in-cluster name at all
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Istio control plane — sidecars need this for certs, XDS config, telemetry
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    # same-namespace peer traffic — etcd raft, Patroni replication, Redis Sentinel gossip, userservice -> accounts-db
    - to:
        - podSelector: {}
